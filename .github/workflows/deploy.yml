name: Build and Deploy to SiteGround

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          echo "Installing npm dependencies..."
          npm ci --legacy-peer-deps
          echo "Dependencies installed successfully"
          echo "Verifying lucide-react installation..."
          ls -la node_modules/lucide-react/ | head -5
          echo "Checking lucide-react package.json..."
          cat node_modules/lucide-react/package.json | grep -E '"name"|"version"|"typings"'

      - name: Sync manuals
        run: node scripts/sync-manuals.js

      - name: Vite build
        run: npx vite build
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY }}
          VITE_API_URL: https://nhratechservices.com/api

      - name: Post-build cleanup
        run: node -e "const fs=require('fs');const f='dist/index.html';fs.writeFileSync(f,fs.readFileSync(f,'utf8').replace(/<script id=\"vite-plugin-pwa:register-sw\" src=\"\/registerSW.js\"><\/script>/g,''))"

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer:v2

      - name: Create .htaccess
        run: |
          cat > dist/.htaccess << 'EOF'
          <IfModule mod_headers.c>
            <FilesMatch "\.(html)$">
              Header set Cache-Control "no-cache, no-store, must-revalidate"
            </FilesMatch>
            <FilesMatch "\.(js|css)$">
              Header set Cache-Control "public, max-age=31536000, immutable"
            </FilesMatch>
          </IfModule>
          <IfModule mod_rewrite.c>
            RewriteEngine On
            RewriteBase /
            RewriteRule ^api/ - [L]
            RewriteCond %{REQUEST_FILENAME} !-f
            RewriteCond %{REQUEST_FILENAME} !-d
            RewriteRule . /index.html [L]
          </IfModule>
          EOF

      - name: Install Composer dependencies
        run: |
          echo "Installing Composer dependencies..."
          cd api
          composer install --no-dev --optimize-autoloader --no-interaction || exit 1
          cd ..
          echo "Composer dependencies installed successfully"

      # NOTE: Database migrations are NOT run by this workflow.
      # After deploying a new module, an admin must manually run the migration endpoint.
      # See README.md "Post-Deploy Migrations" and docs/INCIDENT_ANALYSIS_RECOVERY.md
      # NOTE: config.php is NOT in this repo (contains secrets). It must exist on the
      # server at api/config.php with production DB credentials. The exclude pattern
      # below preserves the existing server config.php during deploy.
      - name: Copy API to dist
        run: |
          echo "Copying API files to dist..."
          cp -r api dist/
          echo "API files copied successfully"
          echo "Verifying dist contents:"
          ls -la dist/ | head -10

      - name: Preflight validation
        run: |
          echo "=== Preflight Validation ==="
          MISSING=0
          if [ -z "${{ secrets.SITEGROUND_HOST }}" ]; then echo "✗ Missing: SITEGROUND_HOST"; MISSING=1; else echo "✓ SITEGROUND_HOST present"; fi
          if [ -z "${{ secrets.SITEGROUND_USER }}" ]; then echo "✗ Missing: SITEGROUND_USER"; MISSING=1; else echo "✓ SITEGROUND_USER present"; fi
          if [ -z "${{ secrets.SITEGROUND_PORT }}" ]; then echo "✗ Missing: SITEGROUND_PORT"; MISSING=1; else echo "✓ SITEGROUND_PORT present"; fi
          if [ -z "${{ secrets.SITEGROUND_SSH_PRIVATE_KEY }}" ]; then echo "✗ Missing: SITEGROUND_SSH_PRIVATE_KEY"; MISSING=1; else echo "✓ SITEGROUND_SSH_PRIVATE_KEY present"; fi
          if [ -z "${{ secrets.SITEGROUND_SSH_PASSPHRASE }}" ]; then echo "⚠ Optional: SITEGROUND_SSH_PASSPHRASE not set (unencrypted key)"; else echo "✓ SITEGROUND_SSH_PASSPHRASE present"; fi
          if [ $MISSING -eq 1 ]; then
            echo "✗ FAIL: Required secrets missing. Cannot deploy."
            exit 1
          fi
          echo "✓ All required secrets present"

      - name: Setup SSH key
        run: |
          echo "Setting up SSH key..."
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.SITEGROUND_SSH_PRIVATE_KEY }}" > ~/.ssh/siteground_deploy_key
          chmod 600 ~/.ssh/siteground_deploy_key
          echo "SSH key written to ~/.ssh/siteground_deploy_key"
          ssh-keyscan -p "${{ secrets.SITEGROUND_PORT }}" "${{ secrets.SITEGROUND_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true
          echo "Host added to known_hosts"

      - name: Deploy via SFTP using lftp with SSH key
        run: |
          echo "Installing lftp..."
          sudo apt-get update && sudo apt-get install -y lftp
          echo "Deploying to SiteGround via SFTP with SSH key..."
          lftp << EOF
          set sftp:auto-confirm yes
          set net:max-retries 2
          set net:timeout 30
          set sftp:connect-program "ssh -a -x -i ~/.ssh/siteground_deploy_key -p ${{ secrets.SITEGROUND_PORT }} -o StrictHostKeyChecking=accept-new"
          open sftp://${{ secrets.SITEGROUND_USER }}@${{ secrets.SITEGROUND_HOST }}
          mirror -R -v --parallel=3 --exclude=api/config.php ./dist/ /home/customer/www/nhratechservices.com/public_html/
          bye
          EOF
          echo "Deployment complete"

      - name: Post-deploy verification
        run: |
          echo "Waiting for deployment to settle..."
          sleep 10
          
          echo "Fetching production index.html..."
          PROD_HTML=$(curl -s https://nhratechservices.com/)
          
          echo "Checking for production asset hash..."
          # Extract asset hash from index.html (format: index-CgW8nzBi-1778380315451.js)
          ASSET_HASH=$(echo "$PROD_HTML" | grep -oE 'index-[A-Za-z0-9]+-[0-9]+\.js' | head -1)
          if [ -z "$ASSET_HASH" ]; then
            echo "✗ FAIL: Could not find production asset hash"
            exit 1
          fi
          echo "✓ Found production asset: $ASSET_HASH"
          
          echo "Verifying /rules route content..."
          # Fetch a JS chunk that should contain /rules
          RULES_JS=$(curl -s "https://nhratechservices.com/assets/RulesList-" 2>/dev/null || echo "")
          if echo "$PROD_HTML" | grep -q "RulesList"; then
            echo "✓ /rules route present in bundle"
          else
            echo "⚠ WARNING: RulesList not found in main bundle (may be lazy loaded)"
          fi
          
          echo "Checking for NHRA Tech Services branding..."
          if echo "$PROD_HTML" | grep -q "NHRA Tech Services"; then
            echo "✓ NHRA Tech Services branding present"
          else
            echo "✗ FAIL: NHRA Tech Services branding missing"
            exit 1
          fi
          
          echo "Checking for RSA NotFound absence..."
          if echo "$PROD_HTML" | grep -qi "race team"; then
            echo "✗ FAIL: Old RSA branding still present"
            exit 1
          else
            echo "✓ Old RSA branding absent"
          fi
          
          echo ""
          echo "=== API Health Check ==="
          
          echo "Checking API endpoints for fatal errors (HTTP 500)..."
          
          # Check auth endpoint - should not return 500
          AUTH_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://nhratechservices.com/api/auth.php?action=me" || echo "000")
          if [ "$AUTH_STATUS" = "500" ]; then
            echo "✗ FAIL: /api/auth.php returned HTTP 500 (PHP fatal error)"
            exit 1
          elif [ "$AUTH_STATUS" = "000" ]; then
            echo "⚠ WARNING: Could not reach /api/auth.php"
          else
            echo "✓ /api/auth.php returned HTTP $AUTH_STATUS (not 500)"
          fi
          
          # Check parity endpoint - should not return 500
          PARITY_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://nhratechservices.com/api/parity.php?action=events" || echo "000")
          if [ "$PARITY_STATUS" = "500" ]; then
            echo "✗ FAIL: /api/parity.php returned HTTP 500 (PHP fatal error)"
            exit 1
          elif [ "$PARITY_STATUS" = "000" ]; then
            echo "⚠ WARNING: Could not reach /api/parity.php"
          else
            echo "✓ /api/parity.php returned HTTP $PARITY_STATUS (not 500)"
          fi
          
          echo ""
          echo "=== Post-Deploy Verification Complete ==="
          echo "Asset hash: $ASSET_HASH"
          echo "All checks passed"
