name: Build and Deploy to SiteGround

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          echo "Installing npm dependencies..."
          npm ci --legacy-peer-deps
          echo "Dependencies installed successfully"
          echo "Verifying lucide-react installation..."
          ls -la node_modules/lucide-react/ | head -5
          echo "Checking lucide-react package.json..."
          cat node_modules/lucide-react/package.json | grep -E '"name"|"version"|"typings"'

      - name: Sync manuals
        run: node scripts/sync-manuals.js

      - name: Vite build
        run: npx vite build
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY }}
          VITE_API_URL: https://nhratechservices.com/api

      - name: Post-build cleanup
        run: node -e "const fs=require('fs');const f='dist/index.html';fs.writeFileSync(f,fs.readFileSync(f,'utf8').replace(/<script id=\"vite-plugin-pwa:register-sw\" src=\"\/registerSW.js\"><\/script>/g,''))"

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer:v2

      - name: Create .htaccess
        run: |
          cat > dist/.htaccess << 'EOF'
          <IfModule mod_headers.c>
            <FilesMatch "\.(html)$">
              Header set Cache-Control "no-cache, no-store, must-revalidate"
            </FilesMatch>
            <FilesMatch "\.(js|css)$">
              Header set Cache-Control "public, max-age=31536000, immutable"
            </FilesMatch>
          </IfModule>
          <IfModule mod_rewrite.c>
            RewriteEngine On
            RewriteBase /
            RewriteRule ^api/ - [L]
            RewriteCond %{REQUEST_FILENAME} !-f
            RewriteCond %{REQUEST_FILENAME} !-d
            RewriteRule . /index.html [L]
          </IfModule>
          EOF

      - name: Install Composer dependencies
        run: |
          echo "Installing Composer dependencies..."
          cd api
          composer install --no-dev --optimize-autoloader --no-interaction || exit 1
          cd ..
          echo "Composer dependencies installed successfully"

      # NOTE: Database migrations are NOT run by this workflow.
      # After deploying a new module, an admin must manually run the migration endpoint.
      # See README.md "Post-Deploy Migrations" and docs/INCIDENT_ANALYSIS_RECOVERY.md
      # NOTE: config.php is NOT in this repo (contains secrets). It must exist on the
      # server at api/config.php with production DB credentials. The exclude pattern
      # below preserves the existing server config.php during deploy.
      - name: Copy API to dist
        run: |
          echo "Copying API files to dist..."
          cp -r api dist/
          echo "API files copied successfully"
          echo "Verifying dist contents:"
          ls -la dist/ | head -10

      - name: Preflight validation
        run: |
          echo "=== Preflight Validation ==="
          MISSING=0
          if [ -z "${{ secrets.SITEGROUND_SSH_HOST }}" ]; then echo "✗ Missing: SITEGROUND_SSH_HOST"; MISSING=1; else echo "✓ SITEGROUND_SSH_HOST present"; fi
          if [ -z "${{ secrets.SITEGROUND_SSH_USER }}" ]; then echo "✗ Missing: SITEGROUND_SSH_USER"; MISSING=1; else echo "✓ SITEGROUND_SSH_USER present"; fi
          if [ -z "${{ secrets.SITEGROUND_SSH_PORT }}" ]; then echo "✗ Missing: SITEGROUND_SSH_PORT"; MISSING=1; else echo "✓ SITEGROUND_SSH_PORT present"; fi
          if [ -z "${{ secrets.SITEGROUND_SSH_PRIVATE_KEY }}" ]; then echo "✗ Missing: SITEGROUND_SSH_PRIVATE_KEY"; MISSING=1; else echo "✓ SITEGROUND_SSH_PRIVATE_KEY present"; fi
          if [ -z "${{ secrets.SITEGROUND_SSH_PASSPHRASE }}" ]; then echo "⚠ Optional: SITEGROUND_SSH_PASSPHRASE not set (unencrypted key)"; else echo "✓ SITEGROUND_SSH_PASSPHRASE present"; fi
          if [ $MISSING -eq 1 ]; then
            echo "✗ FAIL: Required SSH secrets missing. Cannot deploy."
            echo "See docs/github-actions-ssh-deploy-setup.md for setup instructions."
            exit 1
          fi
          echo "✓ All required SSH secrets present"

      - name: Setup SSH key
        run: |
          echo "Setting up SSH deploy key..."
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.SITEGROUND_SSH_PRIVATE_KEY }}" > ~/.ssh/siteground_deploy_key
          chmod 600 ~/.ssh/siteground_deploy_key
          echo "SSH deploy key written"
          ssh-keyscan -p "${{ secrets.SITEGROUND_SSH_PORT }}" "${{ secrets.SITEGROUND_SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true
          echo "Host added to known_hosts"

      - name: Deploy via SSH/rsync
        run: |
          echo "Deploying to SiteGround via SSH/rsync..."
          rsync -avz \
            --exclude 'api/config.php' \
            -e "ssh -i ~/.ssh/siteground_deploy_key -p ${{ secrets.SITEGROUND_SSH_PORT }} -o StrictHostKeyChecking=yes" \
            dist/ \
            "${{ secrets.SITEGROUND_SSH_USER }}@${{ secrets.SITEGROUND_SSH_HOST }}:/home/customer/www/nhratechservices.com/public_html/"
          echo "Deployment complete"

      - name: Post-deploy verification
        run: |
          echo "Waiting for deployment to settle..."
          sleep 15

          # ── Step 1: Expected asset from dist/index.html ──
          echo "=== Step 1: Expected asset from dist/index.html ==="
          EXPECTED_ASSET=$(node -e "
            const fs = require('fs');
            const html = fs.readFileSync('dist/index.html', 'utf8');
            const m = html.match(/(?:https?:\/\/[^\"']+)?\/?\/assets\/index-[^\"']+\.js/);
            if (!m) { console.error('No asset in dist/index.html'); process.exit(1); }
            console.log(m[0].replace(/^.*assets\//, 'assets/'));
          ")
          if [ -z "$EXPECTED_ASSET" ]; then
            echo "✗ FAIL: Could not extract expected asset from dist/index.html"
            head -20 dist/index.html
            exit 1
          fi
          echo "✓ Expected asset: $EXPECTED_ASSET"

          # ── Step 2: SSH remote index.html check ──
          echo ""
          echo "=== Step 2: Remote index.html via SSH ==="
          REMOTE_INDEX_HTML=$(ssh \
            -i ~/.ssh/siteground_deploy_key \
            -p ${{ secrets.SITEGROUND_SSH_PORT }} \
            -o StrictHostKeyChecking=yes \
            ${{ secrets.SITEGROUND_SSH_USER }}@${{ secrets.SITEGROUND_SSH_HOST }} \
            "cat /home/customer/www/nhratechservices.com/public_html/index.html" 2>/dev/null || echo "")
          if [ -z "$REMOTE_INDEX_HTML" ]; then
            echo "⚠ WARNING: Could not read remote index.html via SSH"
          else
            echo "Remote size: $(echo \"$REMOTE_INDEX_HTML\" | wc -c) bytes"
            REMOTE_ASSET=$(echo "$REMOTE_INDEX_HTML" | node -e "
              let h=''; process.stdin.on('data',d=>h+=d);
              process.stdin.on('end',()=>{
                const m=h.match(/(?:https?:\/\/[^\"']+)?\/?\/assets\/index-[^\"']+\.js/);
                if(m) console.log(m[0].replace(/^.*assets\//,'assets/'));
              });
            " || echo "")
            echo "Remote asset ref: ${REMOTE_ASSET:-NONE}"
            if [ "$EXPECTED_ASSET" = "$REMOTE_ASSET" ]; then
              echo "✓ Remote file matches dist asset"
            else
              echo "⚠ Remote/dist mismatch — rsync may have failed or wrong path"
            fi
            echo "$REMOTE_INDEX_HTML" | grep -q "NHRA Tech Services" \
              && echo "✓ Remote contains 'NHRA Tech Services'" \
              || echo "⚠ Remote missing 'NHRA Tech Services'"
          fi

          # ── Step 3: deploy-check.txt document-root probe ──
          echo ""
          echo "=== Step 3: deploy-check.txt document-root probe ==="
          DEPLOY_SHA="${{ github.sha }}"
          echo "$DEPLOY_SHA" > dist/deploy-check.txt
          rsync -az \
            -e "ssh -i ~/.ssh/siteground_deploy_key -p ${{ secrets.SITEGROUND_SSH_PORT }} -o StrictHostKeyChecking=yes" \
            dist/deploy-check.txt \
            "${{ secrets.SITEGROUND_SSH_USER }}@${{ secrets.SITEGROUND_SSH_HOST }}:/home/customer/www/nhratechservices.com/public_html/deploy-check.txt"
          sleep 3
          MARKER=$(curl -sL \
            -H "Cache-Control: no-cache, no-store, must-revalidate" \
            -H "Pragma: no-cache" \
            "https://nhratechservices.com/deploy-check.txt" || echo "CURL_FAILED")
          if echo "$MARKER" | grep -q "$DEPLOY_SHA"; then
            echo "✓ deploy-check.txt confirmed — document root is correct"
          else
            echo "✗ deploy-check.txt mismatch"
            echo "  Expected: $DEPLOY_SHA"
            echo "  Got:      $MARKER"
            echo "  → document root may be wrong or CDN is caching"
          fi

          # ── Step 4: Fetch production HTML with full diagnostics ──
          echo ""
          echo "=== Step 4: Public production index.html ==="
          CB=$(date +%s)
          HTTP_CODE=$(curl -sSL \
            -H "Cache-Control: no-cache, no-store, must-revalidate" \
            -H "Pragma: no-cache" \
            -H "Expires: 0" \
            -D /tmp/prod_headers.txt \
            -o /tmp/prod_index.html \
            -w "%{http_code}" \
            "https://nhratechservices.com/?_deploy_check=${CB}" || echo "000")
          PROD_BYTES=$(wc -c < /tmp/prod_index.html)
          echo "HTTP status: $HTTP_CODE | size: $PROD_BYTES bytes"
          echo "--- Response headers ---"
          cat /tmp/prod_headers.txt
          echo "--- Head -40 ---"
          head -40 /tmp/prod_index.html
          echo "--- Content checks ---"
          grep -qi "<html"         /tmp/prod_index.html && echo "✓ <html present"          || echo "✗ <html missing"
          grep -q  "NHRA Tech"     /tmp/prod_index.html && echo "✓ NHRA Tech present"       || echo "✗ NHRA Tech missing"
          grep -q  "assets/"       /tmp/prod_index.html && echo "✓ assets/ present"         || echo "✗ assets/ missing"
          grep -q  "index-"        /tmp/prod_index.html && echo "✓ index- present"          || echo "✗ index- missing"
          echo "--- First 20 src/href refs ---"
          grep -oE '(src|href)="[^"]+"' /tmp/prod_index.html | head -20 || echo "(none)"

          # ── Step 5: Extract production asset (robust regex) ──
          echo ""
          echo "=== Step 5: Production asset extraction ==="
          PROD_HTML=$(cat /tmp/prod_index.html)
          PROD_ASSET=$(node -e "
            let h=''; process.stdin.on('data',d=>h+=d);
            process.stdin.on('end',()=>{
              const m=h.match(/(?:https?:\/\/[^\"']+)?\/?\/assets\/index-[^\"']+\.js/);
              if(!m){console.error('No asset ref in production HTML');process.exit(1);}
              console.log(m[0].replace(/^.*assets\//,'assets/'));
            });
          " <<< "$PROD_HTML" || true)

          if [ -z "$PROD_ASSET" ]; then
            echo "✗ FAIL: Could not extract asset from production HTML"
            echo "--- Diagnostic summary ---"
            echo "Prod bytes: $PROD_BYTES"
            [ "$PROD_BYTES" -lt 500 ] && echo "⚠ Very small — likely redirect/error page"
            echo "Remote asset (SSH): ${REMOTE_ASSET:-unknown}"
            echo "Expected asset:     $EXPECTED_ASSET"
            exit 1
          fi
          echo "✓ Production asset: $PROD_ASSET"

          # ── Step 6: Compare ──
          echo ""
          echo "=== Step 6: Asset comparison ==="
          if [ "$EXPECTED_ASSET" != "$PROD_ASSET" ]; then
            echo "✗ FAIL: Asset mismatch"
            echo "  Expected (dist): $EXPECTED_ASSET"
            echo "  Production:      $PROD_ASSET"
            echo "  Remote (SSH):    ${REMOTE_ASSET:-unknown}"
            exit 1
          fi
          echo "✓ Asset hash matches: $PROD_ASSET"

          # ── Step 7: Branding checks ──
          echo ""
          echo "=== Step 7: Branding checks ==="
          echo "$PROD_HTML" | grep -q "NHRA Tech Services" \
            && echo "✓ NHRA Tech Services present" \
            || echo "⚠ WARNING: NHRA Tech Services not in HTML (may be runtime-injected)"
          if echo "$PROD_HTML" | grep -qi "race team"; then
            echo "✗ FAIL: Old RSA 'race team' branding in production"
            exit 1
          else
            echo "✓ Old RSA branding absent"
          fi
          
          echo ""
          echo "=== API Health Check ==="
          
          echo "Checking API endpoints for fatal errors (HTTP 500)..."
          
          # Check auth endpoint - should not return 500
          AUTH_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://nhratechservices.com/api/auth.php?action=me" || echo "000")
          if [ "$AUTH_STATUS" = "500" ]; then
            echo "✗ FAIL: /api/auth.php returned HTTP 500 (PHP fatal error)"
            exit 1
          elif [ "$AUTH_STATUS" = "000" ]; then
            echo "⚠ WARNING: Could not reach /api/auth.php"
          else
            echo "✓ /api/auth.php returned HTTP $AUTH_STATUS (not 500)"
          fi
          
          # Check parity endpoint - should not return 500
          PARITY_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://nhratechservices.com/api/parity.php?action=events" || echo "000")
          if [ "$PARITY_STATUS" = "500" ]; then
            echo "✗ FAIL: /api/parity.php returned HTTP 500 (PHP fatal error)"
            exit 1
          elif [ "$PARITY_STATUS" = "000" ]; then
            echo "⚠ WARNING: Could not reach /api/parity.php"
          else
            echo "✓ /api/parity.php returned HTTP $PARITY_STATUS (not 500)"
          fi
          
          # Check rules endpoints - should not return 500
          RULES_LIST_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://nhratechservices.com/api/rules.php?action=list" || echo "000")
          if [ "$RULES_LIST_STATUS" = "500" ]; then
            echo "✗ FAIL: /api/rules.php?action=list returned HTTP 500 (PHP fatal error)"
            exit 1
          elif [ "$RULES_LIST_STATUS" = "000" ]; then
            echo "⚠ WARNING: Could not reach /api/rules.php?action=list"
          else
            echo "✓ /api/rules.php?action=list returned HTTP $RULES_LIST_STATUS (not 500)"
          fi
          
          RULES_CAT_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://nhratechservices.com/api/rules.php?action=categories" || echo "000")
          if [ "$RULES_CAT_STATUS" = "500" ]; then
            echo "✗ FAIL: /api/rules.php?action=categories returned HTTP 500 (PHP fatal error)"
            exit 1
          else
            echo "✓ /api/rules.php?action=categories returned HTTP $RULES_CAT_STATUS (not 500)"
          fi
          
          # Check rules-committees endpoints - should not return 500
          COMMITTEES_LIST_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://nhratechservices.com/api/rules-committees.php?action=list" || echo "000")
          if [ "$COMMITTEES_LIST_STATUS" = "500" ]; then
            echo "✗ FAIL: /api/rules-committees.php?action=list returned HTTP 500 (PHP fatal error)"
            exit 1
          else
            echo "✓ /api/rules-committees.php?action=list returned HTTP $COMMITTEES_LIST_STATUS (not 500)"
          fi
          
          COMMITTEES_CAT_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://nhratechservices.com/api/rules-committees.php?action=categories" || echo "000")
          if [ "$COMMITTEES_CAT_STATUS" = "500" ]; then
            echo "✗ FAIL: /api/rules-committees.php?action=categories returned HTTP 500 (PHP fatal error)"
            exit 1
          else
            echo "✓ /api/rules-committees.php?action=categories returned HTTP $COMMITTEES_CAT_STATUS (not 500)"
          fi
          
          echo ""
          echo "=== Post-Deploy Verification Complete ==="
          echo "Asset: $PROD_ASSET"
          echo "All checks passed"
