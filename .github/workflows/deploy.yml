name: Build and Deploy to SiteGround

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          echo "Installing npm dependencies..."
          npm ci --legacy-peer-deps
          echo "Dependencies installed successfully"
          echo "Verifying lucide-react installation..."
          ls -la node_modules/lucide-react/ | head -5
          echo "Checking lucide-react package.json..."
          cat node_modules/lucide-react/package.json | grep -E '"name"|"version"|"typings"'

      - name: Sync manuals
        run: node scripts/sync-manuals.js

      - name: Vite build
        run: npx vite build
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY }}
          VITE_API_URL: https://nhratechservices.com/api

      - name: Post-build cleanup
        run: node -e "const fs=require('fs');const f='dist/index.html';fs.writeFileSync(f,fs.readFileSync(f,'utf8').replace(/<script id=\"vite-plugin-pwa:register-sw\" src=\"\/registerSW.js\"><\/script>/g,''))"

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer:v2

      - name: Create .htaccess
        run: |
          cat > dist/.htaccess << 'EOF'
          <IfModule mod_headers.c>
            <FilesMatch "\.(html)$">
              Header set Cache-Control "no-cache, no-store, must-revalidate"
            </FilesMatch>
            <FilesMatch "\.(js|css)$">
              Header set Cache-Control "public, max-age=31536000, immutable"
            </FilesMatch>
          </IfModule>
          <IfModule mod_rewrite.c>
            RewriteEngine On
            RewriteBase /
            RewriteRule ^api/ - [L]
            RewriteCond %{REQUEST_FILENAME} !-f
            RewriteCond %{REQUEST_FILENAME} !-d
            RewriteRule . /index.html [L]
          </IfModule>
          EOF

      - name: Install Composer dependencies
        run: |
          echo "Installing Composer dependencies..."
          cd api
          composer install --no-dev --optimize-autoloader --no-interaction || exit 1
          cd ..
          echo "Composer dependencies installed successfully"

      # NOTE: Database migrations are NOT run by this workflow.
      # After deploying a new module, an admin must manually run the migration endpoint.
      # See README.md "Post-Deploy Migrations" and docs/INCIDENT_ANALYSIS_RECOVERY.md
      # NOTE: config.php is NOT in this repo (contains secrets). It must exist on the
      # server at api/config.php with production DB credentials. The exclude pattern
      # below preserves the existing server config.php during deploy.
      - name: Copy API to dist
        run: |
          echo "Copying API files to dist..."
          cp -r api dist/
          echo "API files copied successfully"
          echo "Verifying dist contents:"
          ls -la dist/ | head -10

      - name: Deploy via SFTP using lftp
        run: |
          echo "Installing lftp..."
          sudo apt-get update && sudo apt-get install -y lftp
          echo "Deploying to SiteGround via SFTP..."
          lftp -u "${{ secrets.FTP_USERNAME }},${{ secrets.FTP_PASSWORD }}" -p 18765 sftp://${{ secrets.FTP_SERVER }} << EOF
          set ssl:verify-certificate no
          set sftp:auto-confirm yes
          set net:max-retries 3
          set net:timeout 30
          mirror -R -v --parallel=3 --exclude=config.php ./dist/ /home/customer/www/nhratechservices.com/public_html/
          bye
          EOF
          echo "Deployment complete"
