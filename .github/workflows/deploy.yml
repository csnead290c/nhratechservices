name: Build and Deploy to SiteGround

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          echo "Installing npm dependencies..."
          npm ci --legacy-peer-deps
          echo "Dependencies installed successfully"
          echo "Verifying lucide-react installation..."
          ls -la node_modules/lucide-react/ | head -5
          echo "Checking lucide-react package.json..."
          cat node_modules/lucide-react/package.json | grep -E '"name"|"version"|"typings"'

      - name: Sync manuals
        run: node scripts/sync-manuals.js

      - name: Vite build
        run: npx vite build
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY }}
          VITE_API_URL: https://nhratechservices.com/api

      - name: Post-build cleanup
        run: node -e "const fs=require('fs');const f='dist/index.html';fs.writeFileSync(f,fs.readFileSync(f,'utf8').replace(/<script id=\"vite-plugin-pwa:register-sw\" src=\"\/registerSW.js\"><\/script>/g,''))"

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer:v2

      - name: Create .htaccess
        run: |
          cat > dist/.htaccess << 'EOF'
          <IfModule mod_headers.c>
            <FilesMatch "\.(html)$">
              Header set Cache-Control "no-cache, no-store, must-revalidate"
            </FilesMatch>
            <FilesMatch "\.(js|css)$">
              Header set Cache-Control "public, max-age=31536000, immutable"
            </FilesMatch>
          </IfModule>
          <IfModule mod_rewrite.c>
            RewriteEngine On
            RewriteBase /
            RewriteRule ^api/ - [L]
            RewriteCond %{REQUEST_FILENAME} !-f
            RewriteCond %{REQUEST_FILENAME} !-d
            RewriteRule . /index.html [L]
          </IfModule>
          EOF

      - name: Install Composer dependencies
        run: |
          echo "Installing Composer dependencies..."
          cd api
          composer install --no-dev --optimize-autoloader --no-interaction || exit 1
          cd ..
          echo "Composer dependencies installed successfully"

      # NOTE: Database migrations are NOT run by this workflow.
      # After deploying a new module, an admin must manually run the migration endpoint.
      # See README.md "Post-Deploy Migrations" and docs/INCIDENT_ANALYSIS_RECOVERY.md
      # NOTE: config.php is NOT in this repo (contains secrets). It must exist on the
      # server at api/config.php with production DB credentials. The exclude pattern
      # below preserves the existing server config.php during deploy.
      - name: Copy API to dist
        run: |
          echo "Copying API files to dist..."
          cp -r api dist/
          echo "API files copied successfully"
          echo "Verifying dist contents:"
          ls -la dist/ | head -10

      - name: Preflight validation
        run: |
          echo "=== Preflight Validation ==="
          MISSING=0
          if [ -z "${{ secrets.SITEGROUND_SSH_HOST }}" ]; then echo "✗ Missing: SITEGROUND_SSH_HOST"; MISSING=1; else echo "✓ SITEGROUND_SSH_HOST present"; fi
          if [ -z "${{ secrets.SITEGROUND_SSH_USER }}" ]; then echo "✗ Missing: SITEGROUND_SSH_USER"; MISSING=1; else echo "✓ SITEGROUND_SSH_USER present"; fi
          if [ -z "${{ secrets.SITEGROUND_SSH_PORT }}" ]; then echo "✗ Missing: SITEGROUND_SSH_PORT"; MISSING=1; else echo "✓ SITEGROUND_SSH_PORT present"; fi
          if [ -z "${{ secrets.SITEGROUND_SSH_PRIVATE_KEY }}" ]; then echo "✗ Missing: SITEGROUND_SSH_PRIVATE_KEY"; MISSING=1; else echo "✓ SITEGROUND_SSH_PRIVATE_KEY present"; fi
          if [ -z "${{ secrets.SITEGROUND_SSH_PASSPHRASE }}" ]; then echo "⚠ Optional: SITEGROUND_SSH_PASSPHRASE not set (unencrypted key)"; else echo "✓ SITEGROUND_SSH_PASSPHRASE present"; fi
          if [ $MISSING -eq 1 ]; then
            echo "✗ FAIL: Required SSH secrets missing. Cannot deploy."
            echo "See docs/github-actions-ssh-deploy-setup.md for setup instructions."
            exit 1
          fi
          echo "✓ All required SSH secrets present"

      - name: Setup SSH key
        run: |
          echo "Setting up SSH deploy key..."
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.SITEGROUND_SSH_PRIVATE_KEY }}" > ~/.ssh/siteground_deploy_key
          chmod 600 ~/.ssh/siteground_deploy_key
          echo "SSH deploy key written"
          ssh-keyscan -p "${{ secrets.SITEGROUND_SSH_PORT }}" "${{ secrets.SITEGROUND_SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true
          echo "Host added to known_hosts"

      - name: Deploy via SSH/rsync
        run: |
          echo "Deploying to SiteGround via SSH/rsync..."
          rsync -avz \
            --exclude 'api/config.php' \
            --exclude 'rsa-icon.png' \
            --exclude 'rsa-logo.png' \
            --exclude 'test-*.html' \
            --exclude 'vb6/' \
            --exclude 'manuals/QUARTER_JR_PRO.md' \
            --exclude 'manuals/ENGINE_JR_PRO.md' \
            -e "ssh -i ~/.ssh/siteground_deploy_key -p ${{ secrets.SITEGROUND_SSH_PORT }} -o StrictHostKeyChecking=yes" \
            dist/ \
            "${{ secrets.SITEGROUND_SSH_USER }}@${{ secrets.SITEGROUND_SSH_HOST }}:/home/customer/www/nhratechservices.com/public_html/"
          echo "Deployment complete"

      - name: Remove legacy RSA artifacts from server
        run: |
          echo "Removing legacy RSA/test artifacts from production server..."
          ROOT="/home/customer/www/nhratechservices.com/public_html"
          SSH_CMD="ssh -i ~/.ssh/siteground_deploy_key -p ${{ secrets.SITEGROUND_SSH_PORT }} -o StrictHostKeyChecking=yes ${{ secrets.SITEGROUND_SSH_USER }}@${{ secrets.SITEGROUND_SSH_HOST }}"

          remove_if_exists() {
            local path="$1"
            $SSH_CMD "[ -e \"$ROOT/$path\" ] && rm -f \"$ROOT/$path\" && echo \"removed: $path\" || echo \"not present: $path\""
          }

          # Obsolete unauthenticated bootstrap — removed from the repo; ensure it is
          # not left behind on the server (it performed schema changes and seeded an
          # owner account with a hardcoded password).
          remove_if_exists "api/setup.php"
          remove_if_exists "deploy.sh"
          remove_if_exists "rsa-icon.png"
          remove_if_exists "rsa-logo.png"
          remove_if_exists "manuals/QUARTER_JR_PRO.md"
          remove_if_exists "manuals/ENGINE_JR_PRO.md"
          remove_if_exists "test-athroat-calculation.html"
          remove_if_exists "test-basecase.html"
          remove_if_exists "test-both.html"
          remove_if_exists "test-carb-cfm-fix.html"
          remove_if_exists "test-curve-comparison.html"
          remove_if_exists "test-curve-debug.html"
          remove_if_exists "test-detailed.html"
          remove_if_exists "test-dyno-curve-accuracy.html"
          remove_if_exists "test-engine-pro-calc.html"
          remove_if_exists "test-engine.html"
          remove_if_exists "test-exact-basecase.html"
          remove_if_exists "test-exact-vb6-trace.html"
          remove_if_exists "test-formula-check.html"
          remove_if_exists "test-inline-fix.html"
          remove_if_exists "test-input-sensitivity.html"
          remove_if_exists "test-iteration-divergence.html"
          remove_if_exists "test-iteration-trace.html"
          remove_if_exists "test-precision.html"
          remove_if_exists "test-single-precision.html"
          remove_if_exists "test-vb6-curve.html"
          remove_if_exists "test-vb6-engine-function.html"
          remove_if_exists "test-vb6-precision-final.html"
          remove_if_exists "test-vb6-precision.html"
          $SSH_CMD "[ -d \"$ROOT/vb6\" ] && rm -rf \"$ROOT/vb6\" && echo \"removed: vb6/\" || echo \"not present: vb6/\""
          echo "Legacy artifact cleanup complete"

      - name: Post-deploy verification
        run: |
          echo "Waiting for deployment to settle..."
          sleep 15

          # ── Step 1: Expected asset from dist/index.html ──
          echo "=== Step 1: Expected asset from dist/index.html ==="
          EXPECTED_ASSET=$(node -e "
            const fs = require('fs');
            const html = fs.readFileSync('dist/index.html', 'utf8');
            const m = html.match(/(?:https?:\/\/[^\"']+)?\/?\/assets\/index-[^\"']+\.js/);
            if (!m) { console.error('No asset in dist/index.html'); process.exit(1); }
            console.log(m[0].replace(/^.*assets\//, 'assets/'));
          ")
          if [ -z "$EXPECTED_ASSET" ]; then
            echo "✗ FAIL: Could not extract expected asset from dist/index.html"
            head -20 dist/index.html
            exit 1
          fi
          echo "✓ Expected asset: $EXPECTED_ASSET"

          # ── Step 2: SSH remote index.html check ──
          echo ""
          echo "=== Step 2: Remote index.html via SSH ==="
          REMOTE_INDEX_HTML=$(ssh \
            -i ~/.ssh/siteground_deploy_key \
            -p ${{ secrets.SITEGROUND_SSH_PORT }} \
            -o StrictHostKeyChecking=yes \
            ${{ secrets.SITEGROUND_SSH_USER }}@${{ secrets.SITEGROUND_SSH_HOST }} \
            "cat /home/customer/www/nhratechservices.com/public_html/index.html" 2>/dev/null || echo "")
          if [ -z "$REMOTE_INDEX_HTML" ]; then
            echo "⚠ WARNING: Could not read remote index.html via SSH"
          else
            echo "Remote size: $(echo \"$REMOTE_INDEX_HTML\" | wc -c) bytes"
            REMOTE_ASSET=$(echo "$REMOTE_INDEX_HTML" | node -e "
              let h=''; process.stdin.on('data',d=>h+=d);
              process.stdin.on('end',()=>{
                const m=h.match(/(?:https?:\/\/[^\"']+)?\/?\/assets\/index-[^\"']+\.js/);
                if(m) console.log(m[0].replace(/^.*assets\//,'assets/'));
              });
            " || echo "")
            echo "Remote asset ref: ${REMOTE_ASSET:-NONE}"
            if [ "$EXPECTED_ASSET" = "$REMOTE_ASSET" ]; then
              echo "✓ Remote file matches dist asset"
            else
              echo "⚠ Remote/dist mismatch — rsync may have failed or wrong path"
            fi
            echo "$REMOTE_INDEX_HTML" | grep -q "NHRA Tech Services" \
              && echo "✓ Remote contains 'NHRA Tech Services'" \
              || echo "⚠ Remote missing 'NHRA Tech Services'"
          fi

          # ── Step 3: SSH-based asset verification (authoritative) ──
          # Note: HTTP curl checks are skipped because SiteGround's SGcaptcha
          # bot-protection blocks GitHub Actions runner IPs (returns 202 challenge).
          # SSH verification is the authoritative check.
          echo ""
          echo "=== Step 3: SSH asset verification ==="
          SSH_CMD="ssh -i ~/.ssh/siteground_deploy_key -p ${{ secrets.SITEGROUND_SSH_PORT }} -o StrictHostKeyChecking=yes ${{ secrets.SITEGROUND_SSH_USER }}@${{ secrets.SITEGROUND_SSH_HOST }}"
          ROOT="/home/customer/www/nhratechservices.com/public_html"

          REMOTE_ASSET_FILE=$($SSH_CMD "ls $ROOT/assets/index-*.js 2>/dev/null | head -1" || echo "")
          if [ -z "$REMOTE_ASSET_FILE" ]; then
            echo "✗ FAIL: No index-*.js asset found on server"
            exit 1
          fi
          REMOTE_ASSET_BASENAME=$(basename "$REMOTE_ASSET_FILE")
          echo "✓ Remote asset on disk: $REMOTE_ASSET_BASENAME"

          # Verify asset hash matches what was built
          if echo "$EXPECTED_ASSET" | grep -q "$REMOTE_ASSET_BASENAME"; then
            echo "✓ Asset hash matches dist build"
          elif [ "$REMOTE_ASSET" = "$EXPECTED_ASSET" ]; then
            echo "✓ Asset hash confirmed via index.html"
          else
            echo "⚠ WARNING: Remote asset ($REMOTE_ASSET_BASENAME) may differ from expected ($EXPECTED_ASSET)"
            echo "  This can happen if rsync skipped unchanged files (expected behavior)"
          fi

          # ── Step 4: SSH branding check ──
          echo ""
          echo "=== Step 4: SSH branding check ==="
          REMOTE_HTML=$($SSH_CMD "cat $ROOT/index.html" 2>/dev/null || echo "")
          if echo "$REMOTE_HTML" | grep -qi "race team"; then
            echo "✗ FAIL: Old RSA 'race team' branding found on server"
            exit 1
          else
            echo "✓ Old RSA branding absent"
          fi
          if echo "$REMOTE_HTML" | grep -q "NHRA Tech Services"; then
            echo "✓ NHRA Tech Services branding present"
          else
            echo "⚠ NHRA Tech Services not in static HTML (may be runtime-injected — OK)"
          fi

          # ── Step 5: SSH PHP syntax check on key API files ──
          echo ""
          echo "=== Step 5: SSH PHP syntax check ==="
          for phpfile in parity.php parity_div.php auth.php; do
            SYNTAX=$($SSH_CMD "php -l $ROOT/api/$phpfile 2>&1" || echo "ERROR")
            if echo "$SYNTAX" | grep -q "No syntax errors"; then
              echo "✓ $phpfile — syntax OK"
            elif echo "$SYNTAX" | grep -qi "error"; then
              echo "✗ FAIL: $phpfile has PHP syntax errors:"
              echo "  $SYNTAX"
              exit 1
            else
              echo "⚠ $phpfile — could not check: $SYNTAX"
            fi
          done

          echo ""
          echo "=== Post-Deploy Verification Complete ==="
          echo "Asset: $EXPECTED_ASSET"
          echo "All checks passed (SSH-verified)"
